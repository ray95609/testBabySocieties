<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8ea">
  <title>一年級，選社團囉！｜鶯歌國小</title>
  <style>
    :root {
      --ink: #29304a;
      --paper: #fffdfa;
      --cream: #fff8ea;
      --yellow: #ffd76a;
      --pink: #ff8fab;
      --blue: #6ecff6;
      --green: #7ed7b5;
      --purple: #a78bfa;
      --shadow: 0 12px 30px rgba(51, 63, 94, .13);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 8%, rgba(255, 215, 106, .25) 0 90px, transparent 92px),
        radial-gradient(circle at 92% 18%, rgba(110, 207, 246, .20) 0 120px, transparent 122px),
        var(--cream);
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    }

    button { font: inherit; }

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 410px;
      padding: 54px 24px 42px;
      text-align: center;
      background: linear-gradient(155deg, #fff0bd 0%, #ffe3ed 48%, #dff5ff 100%);
      border-bottom: 6px solid rgba(255,255,255,.8);
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 70px;
      background: rgba(255,255,255,.75);
      border-radius: 999px;
      filter: blur(.2px);
      animation: cloud-drift 9s ease-in-out infinite alternate;
    }

    .hero::before { left: -55px; top: 80px; }
    .hero::after { right: -60px; top: 210px; animation-delay: -4s; }

    .school-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border: 2px solid rgba(41,48,74,.12);
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      font-weight: 800;
      letter-spacing: .04em;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 20px 0 10px;
      font-size: clamp(2.35rem, 7vw, 5rem);
      line-height: 1.05;
      letter-spacing: .03em;
      text-shadow: 0 4px 0 #fff;
    }

    .rainbow-word { color: #f65d83; }

    .hero p {
      position: relative;
      z-index: 1;
      margin: 0 auto;
      font-size: clamp(1.1rem, 3vw, 1.55rem);
      font-weight: 800;
    }

    .hero-art {
      display: block;
      width: min(420px, 92vw);
      margin: 18px auto -42px;
      overflow: visible;
    }

    .hero-art .star { animation: twinkle 1.8s ease-in-out infinite; transform-origin: center; }
    .hero-art .star:nth-child(2) { animation-delay: -.6s; }
    .hero-art .star:nth-child(3) { animation-delay: -1.2s; }
    .hero-art .kid { animation: hello 2s ease-in-out infinite; transform-origin: 178px 116px; }
    .hero-art .balloon { animation: balloon 2.8s ease-in-out infinite alternate; }

    .wrap {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    .intro {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 44px 4px 18px;
    }

    .intro h2 {
      margin: 0;
      font-size: clamp(1.55rem, 4vw, 2.3rem);
    }

    .intro strong { color: #ed577d; }

    .motion-toggle {
      flex: none;
      min-height: 48px;
      padding: 10px 17px;
      border: 0;
      border-radius: 16px;
      color: var(--ink);
      background: #fff;
      box-shadow: var(--shadow);
      font-weight: 900;
      cursor: pointer;
    }

    .filters {
      display: flex;
      gap: 10px;
      padding: 8px 2px 25px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .filter {
      flex: none;
      min-height: 46px;
      padding: 10px 17px;
      border: 2px solid transparent;
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255,255,255,.86);
      box-shadow: 0 5px 15px rgba(51,63,94,.08);
      font-weight: 900;
      cursor: pointer;
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .filter:hover { transform: translateY(-2px); }
    .filter[aria-pressed="true"] { border-color: var(--ink); background: var(--yellow); }

    .club-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      padding: 4px 0 56px;
    }

    .club-card {
      --accent: #ff8fab;
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 3px solid rgba(41,48,74,.09);
      border-radius: 28px;
      background: var(--paper);
      box-shadow: var(--shadow);
      cursor: pointer;
      outline: none;
      transition: transform .25s ease, box-shadow .25s ease;
      animation: card-in .55s both;
    }

    .club-card:hover,
    .club-card:focus-visible {
      transform: translateY(-7px) rotate(-.4deg);
      box-shadow: 0 18px 36px rgba(51,63,94,.18);
    }

    .club-card:focus-visible { border-color: var(--accent); }
    .club-card.hidden { display: none; }
    .club-card.pop { animation: card-pop .48s ease; }

    .art-box {
      position: relative;
      aspect-ratio: 16 / 9;
      perspective: 1000px;
      background: color-mix(in srgb, var(--accent) 18%, white);
      border-bottom: 3px dashed color-mix(in srgb, var(--accent) 65%, white);
      user-select: none;
    }

    .flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .club-card.is-flipped .flip-inner {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      border-radius: 25px 25px 0 0;
    }

    .face-front {
      background: #eee;
    }

    .face-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .club-card:hover .face-front img {
      transform: scale(1.05);
    }

    .face-back {
      transform: rotateY(180deg);
      background: color-mix(in srgb, var(--accent) 18%, white);
    }

    .face-back::before {
      content: "";
      position: absolute;
      inset: auto -8% -40% 35%;
      height: 88%;
      border-radius: 50%;
      background: rgba(255,255,255,.55);
    }

    .club-art { position: relative; z-index: 1; display: block; width: 100%; height: 100%; }

    .card-copy { padding: 18px 19px 20px; }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 9px;
    }

    .day, .code {
      display: inline-flex;
      align-items: center;
      min-height: 31px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: .86rem;
      font-weight: 900;
    }

    .day { background: color-mix(in srgb, var(--accent) 22%, white); }
    .code { color: #677089; background: #f1f3f7; }

    .club-card h3 {
      min-height: 2.5em;
      margin: 0 0 8px;
      font-size: clamp(1.22rem, 2.1vw, 1.55rem);
      line-height: 1.25;
    }

    .club-card p {
      margin: 0;
      color: #555f77;
      font-size: 1.04rem;
      font-weight: 800;
      line-height: 1.55;
    }

    .tap-hint {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 5;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(4px);
      font-size: .76rem;
      font-weight: 900;
      box-shadow: 0 4px 12px rgba(41,48,74,.15);
      border: 1px solid rgba(41,48,74,.08);
      pointer-events: none;
      transition: background .25s ease, transform .25s ease;
    }

    .parent-note {
      margin: 0 0 50px;
      border: 2px solid rgba(41,48,74,.1);
      border-radius: 20px;
      background: rgba(255,255,255,.78);
    }

    .parent-note summary {
      padding: 16px 18px;
      font-weight: 900;
      cursor: pointer;
    }

    .parent-note div { padding: 0 18px 18px; color: #586079; line-height: 1.7; }
    .parent-note a { color: #315cbe; font-weight: 800; }

    footer {
      padding: 28px 20px 40px;
      text-align: center;
      color: #667087;
      background: #fff;
      font-weight: 700;
    }

    /* SVG 動畫 */
    .spin { animation: spin 2.2s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spin-fast { animation: spin .55s linear infinite; transform-box: fill-box; transform-origin: center; }
    .bounce { animation: bounce 1.35s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .bounce-late { animation: bounce 1.35s -.55s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float { animation: float 2.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .float-late { animation: float 2.1s -.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .wiggle { animation: wiggle 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
    .swing { animation: swing 1.15s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom left; }
    .pulse { animation: pulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .roll { animation: roll-across 3.3s ease-in-out infinite; }
    .fly { animation: fly-across 3s ease-in-out infinite; }
    .draw-line { stroke-dasharray: 180; stroke-dashoffset: 180; animation: draw 2s ease-in-out infinite; }
    .cup-one { animation: stack-one 1.8s ease-in-out infinite; }
    .cup-two { animation: stack-two 1.8s ease-in-out infinite; }
    .cup-three { animation: stack-three 1.8s ease-in-out infinite; }
    .dance-a { animation: dance-a .85s ease-in-out infinite alternate; transform-origin: 135px 112px; }
    .dance-b { animation: dance-b .85s ease-in-out infinite alternate; transform-origin: 167px 112px; }
    .note-up { animation: note-up 2.2s ease-out infinite; }
    .orbit { animation: orbit 2.4s linear infinite; transform-origin: 150px 92px; }
    .drone { animation: drone 2.8s ease-in-out infinite; }
    .bat { animation: bat 1.7s ease-in-out infinite; transform-origin: 90px 126px; }
    .ball-fly { animation: ball-fly 1.7s ease-in-out infinite; }
    .paddle { animation: paddle .75s ease-in-out infinite alternate; transform-origin: 98px 116px; }
    .ping { animation: ping 1.5s linear infinite; }
    .skate { animation: skate 2.8s ease-in-out infinite; }
    .frisbee { animation: frisbee 2.4s ease-in-out infinite; }
    .volley { animation: volley 1.8s ease-in-out infinite; }

    body.motion-paused .club-art *,
    body.motion-paused .hero * { animation-play-state: paused !important; }

    @keyframes cloud-drift { to { transform: translateX(50px); } }
    @keyframes twinkle { 0%,100% { transform: scale(.75) rotate(0); opacity: .45; } 50% { transform: scale(1.25) rotate(25deg); opacity: 1; } }
    @keyframes hello { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
    @keyframes balloon { to { transform: translateY(-14px) rotate(2deg); } }
    @keyframes card-in { from { opacity: 0; transform: translateY(20px); } }
    @keyframes card-pop { 50% { transform: translateY(-5px) scale(1.025); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bounce { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-18px) scale(1.04); } }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-12px) rotate(5deg); } }
    @keyframes wiggle { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    @keyframes swing { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }
    @keyframes pulse { 0%,100% { transform: scale(.9); opacity: .7; } 50% { transform: scale(1.12); opacity: 1; } }
    @keyframes roll-across { 0%,100% { transform: translateX(-38px) rotate(-5deg); } 50% { transform: translateX(45px) rotate(4deg); } }
    @keyframes fly-across { 0% { transform: translate(-55px, 25px) rotate(-10deg); } 50% { transform: translate(50px, -30px) rotate(10deg); } 100% { transform: translate(-55px, 25px) rotate(-10deg); } }
    @keyframes draw { 0% { stroke-dashoffset: 180; } 55%,100% { stroke-dashoffset: 0; } }
    @keyframes stack-one { 0%,20% { transform: translate(0,0); } 50%,90% { transform: translate(38px,-49px); } }
    @keyframes stack-two { 0%,20% { transform: translate(0,0); } 50%,90% { transform: translate(-38px,-49px); } }
    @keyframes stack-three { 0%,20% { transform: translate(0,0); } 50%,90% { transform: translate(0,-93px); } }
    @keyframes dance-a { to { transform: rotate(7deg) translateY(-7px); } }
    @keyframes dance-b { to { transform: rotate(-7deg) translateY(-4px); } }
    @keyframes note-up { 0% { transform: translateY(18px); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(-44px); opacity: 0; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes drone { 0%,100% { transform: translate(0,5px); } 35% { transform: translate(25px,-16px) rotate(3deg); } 70% { transform: translate(-25px,-10px) rotate(-3deg); } }
    @keyframes bat { 0%,45%,100% { transform: rotate(-22deg); } 60% { transform: rotate(38deg); } }
    @keyframes ball-fly { 0%,48% { transform: translate(0,0); } 72%,100% { transform: translate(100px,-53px); } }
    @keyframes paddle { to { transform: rotate(17deg); } }
    @keyframes ping { 0%,100% { transform: translate(0,22px); } 25% { transform: translate(45px,-26px); } 50% { transform: translate(90px,22px); } 75% { transform: translate(45px,-12px); } }
    @keyframes skate { 0%,100% { transform: translateX(-50px) rotate(-3deg); } 50% { transform: translateX(55px) rotate(3deg); } }
    @keyframes frisbee { 0% { transform: translate(-55px,25px) rotate(0); } 50% { transform: translate(65px,-24px) rotate(170deg); } 100% { transform: translate(-55px,25px) rotate(360deg); } }
    @keyframes volley { 0%,100% { transform: translate(0,35px); } 50% { transform: translate(90px,-47px); } }

    @media (max-width: 900px) { .club-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 610px) {
      .hero { min-height: 365px; padding-top: 34px; }
      .intro { align-items: flex-start; padding-top: 32px; }
      .intro h2 { max-width: 12em; }
      .motion-toggle { padding: 9px 12px; }
      .club-grid { grid-template-columns: 1fr; gap: 17px; }
      .club-card h3 { min-height: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

          <h3>${club.name}</h3>
          <p>${club.intro}</p>
        </div>
      </article>`).join('');

    function toggleFlip(card) {
      const isFlipped = card.classList.toggle('is-flipped');
      const hint = card.querySelector('.tap-hint');
      if (hint) {
        hint.textContent = isFlipped ? '點我看照片 📷' : '點我看動畫 🎬';
      }
    }

    grid.addEventListener('click', event => {
      const card = event.target.closest('.club-card');
      if (card) toggleFlip(card);
    });

    grid.addEventListener('keydown', event => {
      if ((event.key === 'Enter' || event.key === ' ') && event.target.classList.contains('club-card')) {
        event.preventDefault();
        toggleFlip(event.target);
      }
    });

    document.querySelector('.filters').addEventListener('click', event => {
      const button = event.target.closest('.filter');
      if (!button) return;
      document.querySelectorAll('.filter').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      const selected = button.dataset.day;
      document.querySelectorAll('.club-card').forEach(card => {
        card.classList.toggle('hidden', selected !== '全部' && card.dataset.day !== selected);
      });
    });

    document.querySelector('#motionToggle').addEventListener('click', event => {
      const paused = document.body.classList.toggle('motion-paused');
      event.currentTarget.setAttribute('aria-pressed', String(paused));
      event.currentTarget.textContent = paused ? '▶ 播放動畫' : '⏸ 暫停動畫';
    });
  </script>
</body>
</html>
