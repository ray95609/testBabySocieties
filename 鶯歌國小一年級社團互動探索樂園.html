<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffe8ec">
  <title>🌟 寶寶社團大冒險！一年級選社團 🎮｜鶯歌國小</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #22293f;
      --paper: #ffffff;
      --cream: #fff9f0;
      --yellow: #ffdb4d;
      --pink: #ff6b8b;
      --pink-soft: #ffe4ea;
      --blue: #4fc3f7;
      --green: #5cdbb5;
      --purple: #9d7bf5;
      --orange: #ff9f43;
      --shadow-big: 0 16px 36px rgba(45, 55, 85, .15);
      --shadow-pop: 0 22px 48px rgba(255, 107, 139, .25);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 12%, rgba(255, 219, 77, .35) 0 130px, transparent 132px),
        radial-gradient(circle at 92% 16%, rgba(79, 195, 247, .30) 0 160px, transparent 162px),
        radial-gradient(circle at 50% 80%, rgba(255, 107, 139, .15) 0 220px, transparent 222px),
        var(--cream);
      font-family: "Zen Maru Gothic", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    }

    /* 頂部 Hero */
    .hero {
      position: relative;
      overflow: hidden;
      min-height: 380px;
      padding: 45px 24px 35px;
      text-align: center;
      background: linear-gradient(145deg, #ffe17d 0%, #ffccd8 45%, #cbeefd 100%);
      border-bottom: 8px solid #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }

    .school-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px;
      border: 3px solid rgba(41,48,74,.15);
      border-radius: 999px;
      background: #ffffff;
      font-size: 1.15rem;
      font-weight: 900;
      box-shadow: 0 6px 16px rgba(0,0,0,.08);
      animation: float-slow 3s ease-in-out infinite alternate;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 18px 0 10px;
      font-size: clamp(2.4rem, 6.5vw, 4.6rem);
      line-height: 1.15;
      letter-spacing: .03em;
      color: #2b3253;
      text-shadow: 4px 4px 0 #ffffff, 7px 7px 0 rgba(255,107,139,.3);
    }

    .rainbow-badge {
      display: inline-block;
      padding: 4px 16px;
      background: linear-gradient(90deg, #ff6b8b, #ff9f43, #ffd200, #4cd137, #487eb0, #8c7ae6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      transform: rotate(-2deg);
    }

    .hero p {
      position: relative;
      z-index: 1;
      margin: 0 auto 10px;
      font-size: clamp(1.2rem, 3vw, 1.65rem);
      font-weight: 900;
      color: #384260;
    }

    .guide-banner {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      padding: 10px 24px;
      border-radius: 20px;
      background: rgba(255,255,255,.92);
      font-size: 1.05rem;
      font-weight: 900;
      color: #e84118;
      box-shadow: 0 6px 18px rgba(232, 65, 24, .15);
      border: 2px dashed #ff7675;
    }

    /* 容器 */
    .wrap {
      width: min(1360px, calc(100% - 36px));
      margin: 0 auto;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 32px 6px 16px;
    }

    .toolbar h2 {
      margin: 0;
      font-size: clamp(1.7rem, 3.5vw, 2.5rem);
      font-weight: 900;
    }

    .toolbar h2 span {
      color: #ff4757;
      background: #ffe4ea;
      padding: 2px 14px;
      border-radius: 16px;
      border: 3px solid #ff6b8b;
    }

    .filters {
      display: flex;
      gap: 12px;
      padding: 10px 2px 28px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .filter {
      flex: none;
      min-height: 52px;
      padding: 10px 22px;
      border: 3px solid transparent;
      border-radius: 999px;
      color: var(--ink);
      background: #ffffff;
      box-shadow: 0 6px 18px rgba(51,63,94,.1);
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      transition: all .25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .filter:hover { transform: translateY(-3px) scale(1.04); }
    .filter[aria-pressed="true"] {
      border-color: var(--ink);
      background: var(--yellow);
      transform: scale(1.06);
      box-shadow: 0 10px 24px rgba(255, 219, 77, .45);
    }

    /* 大卡片網格 */
    .club-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 36px;
      padding: 10px 0 70px;
    }

    .club-card {
      --accent: #ff6b8b;
      position: relative;
      border: 4px solid #22293f;
      border-radius: 36px;
      background: var(--paper);
      box-shadow: var(--shadow-big);
      outline: none;
      transition: transform .3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .3s ease;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .club-card:hover {
      transform: translateY(-8px) scale(1.015);
      box-shadow: var(--shadow-pop);
      border-color: var(--accent);
    }

    .club-card.hidden { display: none; }

    /* 頂部大圖區 + 3D 翻轉效果 */
    .card-visual {
      position: relative;
      width: 100%;
      height: 320px;
      perspective: 1200px;
      background: color-mix(in srgb, var(--accent) 15%, white);
      border-bottom: 4px solid #22293f;
      cursor: pointer;
      user-select: none;
    }

    .flip-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .club-card.is-flipped .flip-inner {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
    }

    .face-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .5s ease;
    }

    .club-card:hover .face-front img {
      transform: scale(1.06);
    }

    .face-back {
      transform: rotateY(180deg);
      background: color-mix(in srgb, var(--accent) 20%, white);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
    }

    .club-art {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 卡片浮動徽章 */
    .card-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 5;
      padding: 6px 16px;
      border-radius: 999px;
      background: #22293f;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 900;
      box-shadow: 0 4px 14px rgba(0,0,0,.25);
    }

    .flip-hint {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 5;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,.94);
      color: #22293f;
      font-size: .95rem;
      font-weight: 900;
      box-shadow: 0 6px 16px rgba(0,0,0,.15);
      border: 2px solid rgba(34,41,63,.1);
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      animation: pulse-badge 2s infinite ease-in-out;
    }

    /* 卡片內容說明欄 */
    .card-body {
      padding: 26px 28px 24px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 16px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .day-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--accent) 25%, white);
      font-size: 1.05rem;
      font-weight: 900;
      color: #22293f;
    }

    .speech-btn {
      border: 2px solid #22293f;
      border-radius: 999px;
      background: #ffffff;
      padding: 6px 14px;
      font-size: .95rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .2s ease;
    }

    .speech-btn:hover {
      background: #ffeaa7;
      transform: scale(1.05);
    }

    .club-title {
      margin: 0;
      font-size: clamp(1.6rem, 2.5vw, 2.1rem);
      font-weight: 900;
      line-height: 1.25;
      color: #1e272e;
    }

    .club-desc {
      margin: 0;
      font-size: 1.22rem;
      font-weight: 800;
      line-height: 1.6;
      color: #485460;
    }

    /* 遊戲互動探索大按鈕 */
    .game-launch-btn {
      margin-top: 8px;
      width: 100%;
      min-height: 62px;
      border: 3px solid #22293f;
      border-radius: 22px;
      background: linear-gradient(135deg, #ffd32a 0%, #ff9f1a 100%);
      color: #22293f;
      font-size: 1.3rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      box-shadow: 0 8px 0 #22293f, 0 14px 20px rgba(255, 159, 26, .35);
      transition: all .15s ease;
    }

    .game-launch-btn:hover {
      transform: translateY(3px);
      box-shadow: 0 5px 0 #22293f, 0 10px 15px rgba(255, 159, 26, .3);
      background: linear-gradient(135deg, #ffe066 0%, #ffa834 100%);
    }

    .game-launch-btn:active {
      transform: translateY(8px);
      box-shadow: 0 0 0 #22293f;
    }

    /* 互動小遊戲彈窗 Modal */
    .game-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(25, 30, 48, .82);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }

    .game-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .game-modal-card {
      position: relative;
      width: min(840px, 96vw);
      max-height: 94vh;
      overflow-y: auto;
      border: 5px solid #22293f;
      border-radius: 36px;
      background: #ffffff;
      box-shadow: 0 25px 60px rgba(0,0,0,.4);
      padding: 32px 28px 28px;
      text-align: center;
      transform: scale(0.85);
      transition: transform .35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .game-modal-overlay.active .game-modal-card {
      transform: scale(1);
    }

    .modal-close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 48px;
      height: 48px;
      border: 3px solid #22293f;
      border-radius: 50%;
      background: #ff4757;
      color: #fff;
      font-size: 1.6rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .2s ease;
    }

    .modal-close-btn:hover { transform: scale(1.15) rotate(90deg); }

    .game-header h3 {
      margin: 0 0 6px;
      font-size: 2.1rem;
      font-weight: 900;
      color: #22293f;
    }

    .game-header p {
      margin: 0 0 16px;
      font-size: 1.25rem;
      font-weight: 800;
      color: #57606f;
    }

    /* 圖像化遊戲主舞台 */
    .game-stage-graphic {
      position: relative;
      width: 100%;
      min-height: 380px;
      background: linear-gradient(180deg, #f0f7ff 0%, #e3f2fd 100%);
      border: 4px solid #22293f;
      border-radius: 28px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
    }

    .game-score-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.35rem;
      font-weight: 900;
      color: #2f3542;
      background: #ffffff;
      padding: 8px 24px;
      border-radius: 999px;
      border: 3px solid #22293f;
      box-shadow: 0 4px 10px rgba(0,0,0,.1);
    }

    .game-feedback-box {
      font-size: 1.4rem;
      font-weight: 900;
      color: #ff4757;
      min-height: 2.2em;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* 專屬動畫 Keyframes */
    .spin { animation: spin 2.2s linear infinite; transform-origin: center; }
    .spin-fast { animation: spin .55s linear infinite; transform-origin: center; }
    .bounce { animation: bounce 1.35s ease-in-out infinite; transform-origin: center; }
    .bounce-late { animation: bounce 1.35s -.55s ease-in-out infinite; transform-origin: center; }
    .float { animation: float 2.1s ease-in-out infinite; transform-origin: center; }
    .wiggle { animation: wiggle 1.1s ease-in-out infinite; transform-origin: bottom center; }
    .pulse { animation: pulse 1.4s ease-in-out infinite; transform-origin: center; }

    @keyframes float-slow { to { transform: translateY(-8px); } }
    @keyframes pulse-badge { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }
    @keyframes float { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(4deg); } }
    @keyframes wiggle { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
    @keyframes pulse { 0%,100% { transform: scale(.92); opacity: .8; } 50% { transform: scale(1.08); opacity: 1; } }

    /* ===== 畫布遊戲：小朋友直接用手指操作的舞台 ===== */
    .game-canvas {
      display: block;
      width: 100%;
      max-width: min(640px, calc(46vh * 640 / 360));
      aspect-ratio: 640 / 360;
      margin: 10px auto;
      border: 4px solid #22293f;
      border-radius: 22px;
      background: #eaf6ff;
      touch-action: none;               /* 拖曳時不要跟著捲動頁面 */
      cursor: pointer;
    }

    /* 只有顏色和圖案、完全沒有文字的挑選圈 */
    .picker-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin: 4px 0 6px;
    }

    .picker-dot {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 4px solid #22293f;
      box-shadow: 0 5px 0 #22293f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      cursor: pointer;
      transition: transform .15s ease;
    }

    .picker-dot.on {
      transform: scale(1.18);
      box-shadow: 0 0 0 5px #ffd32a, 0 5px 0 #22293f;
    }

    /* ===== 「再聽一次」語音按鈕 ===== */
    .replay-voice-btn {
      margin: 0 0 14px;
      min-height: 54px;
      padding: 10px 26px;
      border: 3px solid #22293f;
      border-radius: 999px;
      background: #ffe9a8;
      font-size: 1.2rem;
      font-weight: 900;
      font-family: inherit;
      color: #22293f;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 5px 0 #22293f;
      transition: transform .15s ease;
    }
    .replay-voice-btn:hover { transform: translateY(-3px) scale(1.04); }
    .replay-voice-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #22293f; }

    /* ===== ❤️ 我喜歡：寶寶自己選社團 ===== */
    .fav-btn {
      width: 100%;
      min-height: 66px;
      margin-top: 10px;
      border: 3px solid #22293f;
      border-radius: 22px;
      background: #ffffff;
      color: #22293f;
      font-size: 1.3rem;
      font-weight: 900;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 7px 0 #22293f;
      transition: all .15s ease;
    }
    .fav-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 0 #22293f; }
    .fav-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #22293f; }
    .fav-btn.is-fav {
      background: linear-gradient(135deg, #ff6b8b 0%, #ff4757 100%);
      color: #ffffff;
    }
    .fav-btn .fav-face { font-size: 2rem; line-height: 1; }

    .club-card.is-fav {
      border-color: #ff4757;
      box-shadow: 0 0 0 6px rgba(255, 71, 87, .18), var(--shadow-pop);
    }

    .fav-stamp {
      position: absolute;
      top: 14px;
      right: 50%;
      z-index: 6;
      font-size: 2.6rem;
      display: none;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,.3));
      animation: pulse-badge 1.6s infinite ease-in-out;
    }
    .club-card.is-fav .fav-stamp { display: block; }

    /* 右下角固定的「我選了幾個」按鈕 */
    .fav-bar {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 900;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      border: 4px solid #22293f;
      border-radius: 999px;
      background: #ffffff;
      box-shadow: 0 10px 28px rgba(0,0,0,.28);
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      transition: transform .2s ease;
    }
    .fav-bar:hover { transform: scale(1.05); }
    .fav-bar .fav-bar-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      height: 44px;
      padding: 0 10px;
      border-radius: 999px;
      background: #ff4757;
      color: #fff;
      font-size: 1.5rem;
    }

    /* 「寶寶選的社團」結果清單 */
    .fav-list { display: flex; flex-direction: column; gap: 16px; margin: 4px 0 20px; }

    .fav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 16px;
      border: 4px solid #22293f;
      border-radius: 24px;
      background: #fff9f0;
      text-align: left;
    }
    .fav-item img {
      width: 96px;
      height: 96px;
      flex: none;
      object-fit: cover;
      border-radius: 18px;
      border: 3px solid #22293f;
      background: #ffe4ea;
    }
    .fav-item .fav-item-body { flex: 1; min-width: 0; }
    .fav-item .fav-rank {
      font-size: 1.9rem;
      font-weight: 900;
      flex: none;
      width: 44px;
      text-align: center;
    }
    .fav-item .fav-item-name { font-size: 1.35rem; font-weight: 900; line-height: 1.3; }
    .fav-item .fav-item-when { font-size: 1.05rem; font-weight: 800; color: #57606f; margin-top: 4px; }
    .fav-item .fav-item-drop {
      flex: none;
      width: 52px;
      height: 52px;
      border: 3px solid #22293f;
      border-radius: 50%;
      background: #fff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    .fav-empty { font-size: 1.35rem; font-weight: 900; color: #57606f; padding: 30px 10px; }

    /* 慶祝彩帶 */
    .confetti-bit {
      position: fixed;
      top: -50px;
      z-index: 2000;
      pointer-events: none;
      animation: confetti-fall 2.4s linear forwards;
    }
    @keyframes confetti-fall {
      to { transform: translateY(105vh) rotate(520deg); opacity: .1; }
    }

    @media (max-width: 960px) {
      .club-grid { grid-template-columns: 1fr; gap: 28px; }
      .card-visual { height: 270px; }
      .fav-item img { width: 70px; height: 70px; }
      .fav-item .fav-item-name { font-size: 1.15rem; }
      .fav-bar { right: 10px; bottom: 10px; padding: 10px 14px; font-size: 1.05rem; }
    }
  </style>
</head>
<body>

  <header class="hero">
    <div class="school-pill">🏫 新北市鶯歌國小・115學年度上學期</div>
    <h1><span class="rainbow-badge">一年級小神童</span> 社團圖像探索樂園 🏝️</h1>
    <p>看圖點一點就能玩！每一步都會唸給你聽 🔊，喜歡就按 ❤️</p>
    <div class="guide-banner">💡 會跳的按鈕就是下一步！玩完記得按「❤️ 我喜歡」</div>
  </header>

  <main class="wrap">
    <section class="toolbar">
      <h2>專屬推薦：<span>31 個好玩社團</span></h2>
    </section>

    <!-- 星期篩選按鈕 -->
    <nav class="filters" aria-label="依星期篩選">
      <button class="filter" type="button" data-day="全部" aria-pressed="true">🌈 全部社團</button>
      <button class="filter" type="button" data-day="週一" aria-pressed="false">週一</button>

    // 31 款 100% 圖像化獨立社團專屬小遊戲引擎
    const modal = document.querySelector('#gameModal');

    /* ==================================================================
       給看不懂字的小朋友：語音、音效、步驟引導、我喜歡
       ================================================================== */

    /* ---------- 語音引擎 ---------- */
    // 先把 emoji 與符號拿掉，否則語音會把「派對禮炮」之類的圖示名稱唸出來
    const SYMBOL_RE = /[\u{1F000}-\u{1FAFF}\u{2190}-\u{21FF}\u{2300}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE00}-\u{FE0F}\u{1F1E6}-\u{1F1FF}\u{20E3}]/gu;

    function cleanForSpeech(text) {
      return String(text)
        .replace(SYMBOL_RE, ' ')
        .replace(/[【】\[\]()（）「」]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    let zhVoice = null;
    function pickVoice() {
      const list = window.speechSynthesis.getVoices() || [];
      zhVoice = list.find(v => /zh[-_]TW/i.test(v.lang))
        || list.find(v => /zh[-_](HK|CN)/i.test(v.lang))
        || list.find(v => /^zh/i.test(v.lang))
        || null;
    }
    if ('speechSynthesis' in window) {
      pickVoice();
      window.speechSynthesis.addEventListener('voiceschanged', pickVoice);
    }

    // options.queue 為 true 時接在目前這句後面唸，不打斷前一句
    function speak(text, options) {
      if (!('speechSynthesis' in window)) return;
      const words = cleanForSpeech(text);
      if (!words) return;
      const opts = options || {};
      if (!opts.queue) window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(words);
      utter.lang = opts.lang || 'zh-TW';
      utter.rate = opts.rate || 0.88;   // 一年級聽得清楚的速度
      utter.pitch = 1.15;
      if (!opts.lang && zhVoice) utter.voice = zhVoice;   // 唸英文單字時交給英語語音
      window.speechSynthesis.speak(utter);
    }

    function stopSpeaking() {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    /* ---------- 音效（用 WebAudio 直接合成，不需要音檔） ---------- */
    let audioCtx = null;

    function beep(freq, startAt, seconds, type, peak) {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, startAt);
      gain.gain.exponentialRampToValueAtTime(peak, startAt + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, startAt + seconds);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(startAt);
      osc.stop(startAt + seconds + 0.05);
    }

    function sfx(kind) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        if (kind === 'tap') beep(880, now, 0.09, 'sine', 0.16);
        else if (kind === 'nope') { beep(260, now, 0.12, 'square', 0.10); beep(190, now + 0.13, 0.18, 'square', 0.10); }
        else if (kind === 'win') [523, 659, 784, 1047].forEach((f, i) => beep(f, now + i * 0.10, 0.24, 'triangle', 0.16));
        else if (kind === 'heart') [659, 880].forEach((f, i) => beep(f, now + i * 0.09, 0.20, 'sine', 0.16));
      } catch (err) { /* 沒有音效也不影響遊戲 */ }
    }

    /* ---------- 慶祝彩帶 ---------- */
    function burst(symbols) {
      for (let i = 0; i < 20; i++) {
        const bit = document.createElement('span');
        bit.className = 'confetti-bit';
        bit.textContent = symbols[i % symbols.length];
        bit.style.left = (Math.random() * 96) + 'vw';
        bit.style.fontSize = (1.4 + Math.random() * 1.8) + 'rem';
        bit.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
        document.body.appendChild(bit);
        setTimeout(() => bit.remove(), 3200);
      }
    }

    /* ---------- 遊戲回饋自動唸出來 ---------- */
    let lastFeedback = '';
    const feedbackWatcher = new MutationObserver(() => {
      const box = gameStage.querySelector('.game-feedback-box');
      if (!box) return;
      const words = box.textContent.trim();
      if (!words || words === lastFeedback) return;
      lastFeedback = words;
      if (box.textContent.indexOf('🎉') >= 0) {
        sfx('win');
        burst(['🎉', '⭐', '🎊', '✨', '🌈']);
      }
      speak(words, { queue: true });   // 接在按鈕名稱後面唸
    });
    feedbackWatcher.observe(gameStage, { childList: true, subtree: true, characterData: true });

    }

    function isFavorite(code) { return favorites.indexOf(code) >= 0; }

      document.querySelectorAll('[data-fav-code]').forEach(btn => {

      }

      document.querySelector('#favCount').textContent = favorites.length;
    }

    function toggleFavorite(code, event) {
      if (event) event.stopPropagation();
      const club = clubs.find(item => item.code === code);
      if (!club) return;
      const at = favorites.indexOf(code);
      if (at >= 0) {
        favorites.splice(at, 1);
        sfx('nope');
        speak('拿掉了');
      } else {
        favorites.push(code);
        sfx('heart');
        burst(['❤️', '💖', '⭐', '✨']);
        speak('你喜歡 ' + club.name);
      }
      saveFavorites();
      syncFavButtons();
    }
    window.toggleFavorite = toggleFavorite;

    /* ---------- 結果清單：給爸爸媽媽看寶寶選了什麼 ---------- */
    const favModal = document.querySelector('#favModal');

    });

    document.querySelector('#replayVoiceBtn').addEventListener('click', () => {
      speak(modalClubRule.textContent);
      replayDemo();                     // 手再示範一次動作
    });

    /* ---------- 每次打開遊戲時的初始化 ---------- */
    function afterLaunch(club) {
      currentClub = club;
      // 開場提示先記下來，避免和規則語音重複唸同一句
      const box = gameStage.querySelector('.game-feedback-box');
      lastFeedback = box ? box.textContent.trim() : '';
      syncFavButtons();
      speak(modalClubRule.textContent);
    }

    syncFavButtons();

    /* ==================================================================
       真的能用手玩的小遊戲引擎
       設計原則：不看字也能玩
         1. 全部用手指直接操作畫面上的東西（拖、甩、瞄準、畫、接）
         2. 一打開就有半透明的手示範一次動作，小朋友照著比就會
         3. 進度用星星而不是數字，成功用動畫和聲音而不是文字
       ================================================================== */

    const STAGE_W = 640;
    const STAGE_H = 360;

    const Engine = {
      canvas: null,
      ctx: null,
      raf: 0,
      finished: false,
      hooks: {},
      pointer: { x: 0, y: 0, lastX: 0, lastY: 0, down: false },
      demo: null,
      t: 0
    };

    /* ---------- 畫圖小工具 ---------- */
    function drawEmoji(ctx, ch, x, y, size, rot, alpha) {
      ctx.save();
      if (alpha !== undefined) ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      if (rot) ctx.rotate(rot);
      ctx.font = size + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(ch, 0, 0);
      ctx.restore();
    }

    function paintSky(ctx, top, bottom) {
      const g = ctx.createLinearGradient(0, 0, 0, STAGE_H);
      g.addColorStop(0, top || '#eaf6ff');
      g.addColorStop(1, bottom || '#cfe9ff');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, STAGE_W, STAGE_H);
    }

    function drawGround(ctx, y, color) {
      ctx.fillStyle = color || '#8fd66f';
      ctx.fillRect(0, y, STAGE_W, STAGE_H - y);
    }

    // 目標位置的虛線圈，輪到它的時候會發亮跳動
    function drawSlot(ctx, x, y, radius, active) {
      ctx.save();
      ctx.setLineDash([9, 7]);
      ctx.lineWidth = active ? 5 : 3;
      ctx.strokeStyle = active ? '#ff4757' : 'rgba(34,41,63,.35)';
      const grow = active ? Math.sin(Engine.t * 0.12) * 4 : 0;
      ctx.beginPath();
      ctx.arc(x, y, radius + grow, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
    function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

    function stars(done, total) {
      let out = '';
      for (let i = 0; i < total; i++) out += i < done ? '⭐' : '☆';
      return out;
    }

    function setBadge(html) {
      const el = document.querySelector('#scoreBadge');
      if (el) el.innerHTML = html;
    }

    function setFeedback(html) {
      const el = document.querySelector('#gameFeedback');
      if (el) el.innerHTML = html;
    }

    // 贏了：交給既有的觀察器去唸出來、放音效、撒彩帶
    function winGame(message) {
      if (Engine.finished) return;
      Engine.finished = true;
      Engine.demo = null;
      setFeedback('🎉 ' + message);
    }

    /* ---------- 幽靈手示範：看不懂字就看手怎麼動 ---------- */
    function showDemo(points, options) {
      const opts = options || {};
      Engine.lastDemo = { points: points, options: opts };   // 給「再示範一次」用
      Engine.demo = {
        points: points,
        t: 0,
        speed: opts.speed || 0.011,
        tapping: !!opts.tapping
      };
    }

    // 小朋友忘記手要怎麼動的時候，讓幽靈手再比一次
    function replayDemo() {
      if (Engine.lastDemo) showDemo(Engine.lastDemo.points, Engine.lastDemo.options);
    }

    function pathPoint(points, t) {
      if (points.length < 2) return points[0];
      const span = 1 / (points.length - 1);
      const i = Math.min(points.length - 2, Math.floor(t / span));
      const k = (t - i * span) / span;
      return {
        x: points[i].x + (points[i + 1].x - points[i].x) * k,
        y: points[i].y + (points[i + 1].y - points[i].y) * k
      };
    }

    function drawDemo(ctx) {
      const demo = Engine.demo;
      if (!demo) return;
      demo.t += demo.speed;
      if (demo.t >= 1) demo.t = 0;

      if (demo.points.length > 1) {
        ctx.save();
        ctx.globalAlpha = 0.5;
        ctx.setLineDash([11, 9]);
        ctx.lineWidth = 5;
        ctx.strokeStyle = '#ff4757';
        ctx.beginPath();
        demo.points.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        ctx.stroke();
        ctx.restore();
      }

      const pos = pathPoint(demo.points, demo.t);
      const press = demo.tapping ? Math.abs(Math.sin(demo.t * Math.PI * 4)) * 8 : 0;
      ctx.save();
      ctx.globalAlpha = 0.9;
      drawEmoji(ctx, '👆', pos.x, pos.y + 26 - press, 48);
      ctx.restore();
    }

    /* ---------- 舞台與手指事件 ---------- */
    function stopLoop() {
      if (Engine.raf) cancelAnimationFrame(Engine.raf);
      Engine.raf = 0;
    }

    function startLoop() {
      stopLoop();
      const step = () => {
        Engine.t += 1;
        if (Engine.hooks.update) Engine.hooks.update();
        if (Engine.hooks.draw) Engine.hooks.draw(Engine.ctx);
        drawDemo(Engine.ctx);
        Engine.raf = requestAnimationFrame(step);
      };
      Engine.raf = requestAnimationFrame(step);
    }

    // picker：只有顏色或圖案、完全沒有文字的挑選圈
    function buildStage(options) {
      const opts = options || {};
      stopLoop();
      Engine.finished = false;
      Engine.hooks = {};
      Engine.demo = null;
      Engine.t = 0;

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      gameStage.innerHTML =
        '<div class="game-score-badge" id="scoreBadge">' + (opts.badge || '') + '</div>'
        + '<canvas class="game-canvas" id="gameCanvas" width="' + Math.round(STAGE_W * dpr)
        + '" height="' + Math.round(STAGE_H * dpr) + '"></canvas>'
        + (opts.picker || '')
        + '<div class="game-feedback-box" id="gameFeedback">' + (opts.hint || '') + '</div>';

      const canvas = document.querySelector('#gameCanvas');
      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      Engine.canvas = canvas;
      Engine.ctx = ctx;
      bindPointer(canvas);
      return ctx;
    }

    function bindPointer(canvas) {
      const toLocal = evt => {
        const box = canvas.getBoundingClientRect();
        return {
          x: (evt.clientX - box.left) / box.width * STAGE_W,
          y: (evt.clientY - box.top) / box.height * STAGE_H
        };
      };

      canvas.addEventListener('pointerdown', evt => {
        evt.preventDefault();
        try { canvas.setPointerCapture(evt.pointerId); } catch (err) { /* 舊瀏覽器沒有也沒關係 */ }
        const p = toLocal(evt);
        Engine.pointer.x = Engine.pointer.lastX = p.x;
        Engine.pointer.y = Engine.pointer.lastY = p.y;
        Engine.pointer.down = true;
        Engine.demo = null;                       // 小朋友一動手就收起示範
        if (Engine.hooks.down) Engine.hooks.down(p.x, p.y);
      });

      canvas.addEventListener('pointermove', evt => {
        const p = toLocal(evt);
        Engine.pointer.lastX = Engine.pointer.x;
        Engine.pointer.lastY = Engine.pointer.y;
        Engine.pointer.x = p.x;
        Engine.pointer.y = p.y;
        if (Engine.hooks.move) Engine.hooks.move(p.x, p.y, Engine.pointer.down);
      });

      const release = () => {
        if (!Engine.pointer.down) return;
        Engine.pointer.down = false;
        if (Engine.hooks.up) Engine.hooks.up(Engine.pointer.x, Engine.pointer.y);
      };
      canvas.addEventListener('pointerup', release);
      canvas.addEventListener('pointercancel', release);
    }

    /* ==================================================================
       機制一：左右來回拉（扯鈴）
       ================================================================== */
    function playSwing(club, config) {
      buildStage({ badge: stars(0, 5), hint: config.hint });
      let energy = 0, spin = 0, lastDir = 0, handX = STAGE_W / 2, lift = 0, flying = false;
      showDemo([{ x: 180, y: 210 }, { x: 460, y: 210 }, { x: 180, y: 210 }], { speed: 0.009 });

      Engine.hooks.move = (x, y, down) => {
        handX = clamp(x, 120, STAGE_W - 120);
        if (!down || flying) return;
        const dx = Engine.pointer.x - Engine.pointer.lastX;
        if (Math.abs(dx) < 7) return;
        const dir = dx > 0 ? 1 : -1;
        if (dir !== lastDir) {           // 每換一次方向就加速一次
          lastDir = dir;
          energy = Math.min(100, energy + 11);
          sfx('tap');
        }
      };

      Engine.hooks.update = () => {
        spin += 0.06 + energy * 0.022;
        if (flying) { lift = Math.min(230, lift + 5); return; }
        setBadge(stars(Math.floor(energy / 20), 5));
        // 先判斷有沒有轉夠快，再讓速度衰減，否則永遠差那 0.28 飛不起來
        if (energy >= 100) { flying = true; winGame(config.winText); return; }
        energy = Math.max(0, energy - 0.28);       // 手停下來就慢慢變慢
      };

      Engine.hooks.draw = (c) => {
        paintSky(c, '#fff4d6', '#ffd9e2');
        drawGround(c, 320, '#a5e08a');
        const y = 250;
        const leftX = handX - 105, rightX = handX + 105;
        // 兩支手棍
        c.strokeStyle = '#7b4b2a';
        c.lineWidth = 11;
        c.lineCap = 'round';
        [leftX, rightX].forEach(sx => {
          c.beginPath(); c.moveTo(sx, y + 55); c.lineTo(sx, y - 25); c.stroke();
        });
        // 繩子（轉越快垂得越少）
        const sag = 60 - energy * 0.42 - lift;
        c.strokeStyle = '#5f5470';
        c.lineWidth = 3;
        c.beginPath();
        c.moveTo(leftX, y - 25);
        c.quadraticCurveTo(handX, y - 25 + sag, rightX, y - 25);
        c.stroke();
        // 扯鈴本體
        const dy = y - 25 + sag / 2 - lift;
        drawEmoji(c, config.emoji, handX, dy, 74, spin);
        if (energy > 35) {
          for (let i = 0; i < 5; i++) {
            const a = spin * 0.6 + i * 1.256;
            drawEmoji(c, '✨', handX + Math.cos(a) * 62, dy + Math.sin(a) * 62, 22, 0, 0.75);
          }
        }
        if (flying) drawEmoji(c, '🌟', handX, dy - 70, 40, 0, 0.85);
      };

      startLoop();
    }

    /* ==================================================================
       機制二：戳破飄動的目標（英語單字）
       ================================================================== */
    function playPopTargets(club, config) {
      buildStage({ badge: stars(0, config.rounds), hint: config.hint });
      let score = 0, balloons = [], answer = null;

      function newRound() {
        const pool = config.pool.slice();
        answer = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
        const others = [];
        while (others.length < 2 && pool.length) {
          others.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
        }
        balloons = [answer].concat(others)
          .sort(() => Math.random() - 0.5)
          .map((item, i) => ({
            item: item,
            x: 130 + i * 190,
            y: 150 + Math.random() * 60,
            vx: (Math.random() - 0.5) * 1.5,
            vy: (Math.random() - 0.5) * 1.2,
            pop: 0
          }));
        // 題目用英語發音唸出來，畫面同時顯示圖案
        speak(answer.word, { lang: 'en-US', rate: 0.8 });
      }
      newRound();
      showDemo([{ x: 320, y: 170 }], { tapping: true, speed: 0.02 });

      Engine.hooks.down = (x, y) => {
        const hit = balloons.find(b => !b.pop && dist(x, y, b.x, b.y) < 52);
        if (!hit) return;
        if (hit.item === answer) {
          hit.pop = 1;
          score++;
          sfx('heart');
          setBadge(stars(score, config.rounds));
          if (score >= config.rounds) { winGame(config.winText); return; }
          setTimeout(newRound, 700);
        } else {
          sfx('nope');
          hit.x += (Math.random() - 0.5) * 60;    // 答錯就跑掉，再找一次
          speak(answer.word, { lang: 'en-US', rate: 0.8 });
        }
      };

      Engine.hooks.update = () => {
        balloons.forEach(b => {
          if (b.pop) { b.pop += 0.08; return; }
          b.x += b.vx; b.y += b.vy;
          if (b.x < 80 || b.x > STAGE_W - 80) b.vx *= -1;
          if (b.y < 110 || b.y > 250) b.vy *= -1;
        });
      };

      Engine.hooks.draw = (c) => {
        paintSky(c, '#e7f8ff', '#c9ecff');
        // 題目：大大的圖案 + 英文字（字給大人看，圖和聲音給小孩）
        drawEmoji(c, '🔊', 60, 52, 40);
        drawEmoji(c, answer.emoji, 130, 52, 52);
        c.fillStyle = '#22293f';
        c.font = '900 34px "Zen Maru Gothic", sans-serif';
        c.textAlign = 'left';
        c.textBaseline = 'middle';
        c.fillText(answer.word, 175, 54);

        balloons.forEach(b => {
          if (b.pop) {
            drawEmoji(c, '💥', b.x, b.y, 60 + b.pop * 30, 0, Math.max(0, 1 - b.pop));
            return;
          }
          c.save();
          c.fillStyle = '#ffffff';
          c.strokeStyle = '#22293f';
          c.lineWidth = 4;
          c.beginPath();
          c.arc(b.x, b.y, 46, 0, Math.PI * 2);
          c.fill();
          c.stroke();
          c.restore();
          drawEmoji(c, b.item.emoji, b.x, b.y, 52);
          c.strokeStyle = '#22293f';
          c.lineWidth = 2;
          c.beginPath(); c.moveTo(b.x, b.y + 46); c.lineTo(b.x, b.y + 78); c.stroke();
        });
      };

      startLoop();
    }

    /* ==================================================================
       機制三：拖曳組裝（疊杯、裝零件、齒輪、拼豆、積木、看診…）
       ================================================================== */
    function playDragPuzzle(club, config) {
      const total = config.items.length;
      buildStage({ badge: stars(0, total), hint: config.hint });

      const items = config.items.map((it, i) => Object.assign({}, it, {
        idx: i, cx: it.x, cy: it.y, homeX: it.x, homeY: it.y, placed: false
      }));
      let held = null, placed = 0, wrongShake = 0;

      const grabbable = it => !it.placed && (!config.ordered || it.idx === placed);

      showDemo([
        { x: items[0].x, y: items[0].y },
        { x: config.slots[items[0].slot].x, y: config.slots[items[0].slot].y }
      ], { speed: 0.010 });

      Engine.hooks.down = (x, y) => {
        held = null;
        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          if (grabbable(it) && dist(x, y, it.cx, it.cy) < (it.size || 56) * 0.8) { held = it; break; }
        }
        if (held) { sfx('tap'); return; }
        const want = items.find(grabbable);        // 沒抓到就指出該拖哪一個
        if (want) {
          wrongShake = 20;
          showDemo([
            { x: want.homeX, y: want.homeY },
            { x: config.slots[want.slot].x, y: config.slots[want.slot].y }
          ], { speed: 0.014 });
        }
      };

      Engine.hooks.move = (x, y, down) => {
        if (held && down) { held.cx = x; held.cy = y; }
      };

      Engine.hooks.up = () => {
        if (!held) return;
        const slot = config.slots[held.slot];
        if (dist(held.cx, held.cy, slot.x, slot.y) < 66) {
          held.cx = slot.x; held.cy = slot.y; held.placed = true;
          placed++;
          sfx('heart');
          setBadge(stars(placed, total));
          if (placed >= total) winGame(config.winText);
          else if (config.steps && config.steps[placed - 1]) setFeedback(config.steps[placed - 1]);
        } else {
          held.cx = held.homeX; held.cy = held.homeY;   // 沒放對就自己回原位
          sfx('nope');
        }
        held = null;
      };

      Engine.hooks.update = () => { if (wrongShake > 0) wrongShake--; };

      Engine.hooks.draw = (c) => {
        paintSky(c, config.bg1, config.bg2);
        if (config.board) config.board(c, placed, items);

        // 還沒放的目標位置畫虛線圈
        config.slots.forEach((s, i) => {
          const owner = items.find(it => it.slot === i);
          if (owner && owner.placed) return;
          drawSlot(c, s.x, s.y, s.r || 40, !!(owner && grabbable(owner)));
          if (s.ghost) drawEmoji(c, s.ghost, s.x, s.y, s.size || 44, 0, 0.22);
        });

        items.forEach(it => {
          const active = grabbable(it);
          const wobble = (active && !held) ? Math.sin(Engine.t * 0.12) * 4 : 0;
          const shake = (active && wrongShake > 0) ? Math.sin(Engine.t * 0.9) * 7 : 0;
          // 裝好的齒輪之類的零件會自己轉起來，讓小朋友看到「機器動了」
          const spin = (it.placed && it.spin) ? Engine.t * it.spin : (it.rot || 0);
          drawEmoji(c, it.emoji, it.cx + shake, it.cy + wobble, it.size || 56, spin,
            (config.ordered && !active && !it.placed) ? 0.3 : 1);
        });

        if (config.overlay) config.overlay(c, placed, items);
      };

      startLoop();
    }

    /* ==================================================================
       機制四：抓時機點擊（揮棒）
       ================================================================== */
    function playTiming(club, config) {
      buildStage({ badge: stars(0, config.need), hint: config.hint });
      let ballX = STAGE_W + 40, ballY = 210, hits = 0, swinging = 0, flight = null;
      const zoneX = 175;

      showDemo([{ x: zoneX, y: 210 }], { tapping: true, speed: 0.02 });

      function resetBall() { ballX = STAGE_W + 40; ballY = 195 + Math.random() * 40; }

      Engine.hooks.down = () => {
        if (flight) return;
        swinging = 12;
        sfx('tap');
        if (Math.abs(ballX - zoneX) < 46) {          // 打中甜蜜點
          hits++;
          setBadge(stars(hits, config.need));
          flight = { x: ballX, y: ballY, vx: 11 + Math.random() * 4, vy: -13 };
          sfx('heart');
          if (hits >= config.need) winGame(config.winText);
        }
      };

      Engine.hooks.update = () => {
        if (swinging > 0) swinging--;
        if (flight) {
          flight.x += flight.vx; flight.y += flight.vy; flight.vy += 0.42;
          if (flight.x > STAGE_W + 60 || flight.y > STAGE_H + 60) { flight = null; resetBall(); }
          return;
        }
        ballX -= config.speed || 5.2;
        if (ballX < -40) resetBall();
      };

      Engine.hooks.draw = (c) => {
        paintSky(c, '#dff3ff', '#bfe8ff');
        drawGround(c, 285, '#8ed46e');
        // 甜蜜點：球進到這個圈圈裡就是揮棒的時候
        const ready = Math.abs(ballX - zoneX) < 46;
        c.save();
        c.setLineDash([8, 6]);
        c.lineWidth = ready ? 6 : 3;
        c.strokeStyle = ready ? '#ff4757' : 'rgba(34,41,63,.3)';
        c.beginPath(); c.arc(zoneX, 210, 52, 0, Math.PI * 2); c.stroke();
        c.restore();

        drawEmoji(c, config.player, 95, 215, 76);
        drawEmoji(c, config.bat, 150, 205, 62, swinging > 0 ? -0.9 : 0.5);
        if (flight) drawEmoji(c, config.ball, flight.x, flight.y, 34);
        else drawEmoji(c, config.ball, ballX, ballY, 34, Engine.t * 0.2);
      };

      startLoop();
    }

    /* ==================================================================
       機制五：節奏（跳舞）—— 音符掉到線上時點那一排
       ================================================================== */
    function playRhythm(club, config) {
      const lanes = config.lanes;
      buildStage({ badge: stars(0, config.need), hint: config.hint });
      let notes = [], combo = 0, spawn = 0, flash = [0, 0, 0], dancer = 0;
      const lineY = 268;
      const laneX = i => 120 + i * ((STAGE_W - 240) / (lanes.length - 1));

      showDemo([{ x: laneX(1), y: lineY }], { tapping: true, speed: 0.02 });

      Engine.hooks.down = (x, y) => {
        let lane = 0, best = 1e9;
        lanes.forEach((_, i) => { const d = Math.abs(x - laneX(i)); if (d < best) { best = d; lane = i; } });
        flash[lane] = 10;
        const hit = notes.find(n => n.lane === lane && Math.abs(n.y - lineY) < 46);
        if (hit) {
          hit.dead = 1;
          combo++;
          dancer = 20;
          sfx('heart');
          setBadge(stars(Math.min(combo, config.need), config.need));
          if (combo >= config.need) winGame(config.winText);
        } else {
          sfx('nope');
        }
      };

      Engine.hooks.update = () => {
        if (dancer > 0) dancer--;
        spawn--;
        if (spawn <= 0 && !Engine.finished) {
          spawn = config.gap || 60;
          notes.push({ lane: Math.floor(Math.random() * lanes.length), y: -30, dead: 0 });
        }
        notes.forEach(n => { if (n.dead) n.dead += 0.1; else n.y += config.fall || 3.1; });
        notes = notes.filter(n => n.y < STAGE_H + 40 && n.dead < 2);
        flash = flash.map(f => f > 0 ? f - 1 : 0);
      };

      Engine.hooks.draw = (c) => {
        paintSky(c, '#2b2350', '#5a3d86');
        // 舞台聚光燈
        lanes.forEach((_, i) => {
          const g = c.createLinearGradient(laneX(i), 0, laneX(i), lineY);
          g.addColorStop(0, 'rgba(255,255,255,.16)');
          g.addColorStop(1, 'rgba(255,255,255,0)');
          c.fillStyle = g;
          c.fillRect(laneX(i) - 55, 0, 110, lineY);
        });
        // 判定線
        c.strokeStyle = '#ffd32a';
        c.lineWidth = 6;
        c.beginPath(); c.moveTo(60, lineY); c.lineTo(STAGE_W - 60, lineY); c.stroke();
        lanes.forEach((emoji, i) => {
          c.save();
          c.globalAlpha = flash[i] > 0 ? 1 : 0.55;
          c.fillStyle = flash[i] > 0 ? '#ffd32a' : '#ffffff';
          c.beginPath(); c.arc(laneX(i), lineY, 44, 0, Math.PI * 2); c.fill();
          c.restore();
          drawEmoji(c, emoji, laneX(i), lineY, 44);
        });
        notes.forEach(n => {
          if (n.dead) { drawEmoji(c, '✨', laneX(n.lane), lineY, 48 + n.dead * 26, 0, Math.max(0, 1 - n.dead)); return; }
          drawEmoji(c, config.note, laneX(n.lane), n.y, 46);
        });
        drawEmoji(c, config.dancer, STAGE_W / 2, 330, 62, dancer > 0 ? Math.sin(Engine.t) * 0.3 : 0);
      };

      startLoop();
    }

    /* ==================================================================
       機制六：往後拉再放開（飛盤、流星球、骰子）
       ================================================================== */
    function playSling(club, config) {
      buildStage({ badge: stars(0, config.need), hint: config.hint });
      const startX = 110, startY = 250;
      let aim = null, shot = null, score = 0, target = { x: 500, y: 150, dir: 1 };

      showDemo([{ x: startX, y: startY }, { x: startX - 70, y: startY + 55 }], { speed: 0.012 });

      Engine.hooks.down = (x, y) => {
        if (shot) return;
        if (dist(x, y, startX, startY) < 90) { aim = { x: x, y: y }; sfx('tap'); }
      };
      Engine.hooks.move = (x, y, down) => { if (aim && down) { aim.x = x; aim.y = y; } };
      Engine.hooks.up = () => {
        if (!aim) return;
        const power = clamp(dist(aim.x, aim.y, startX, startY) / 8, 3, 19);
        const angle = Math.atan2(startY - aim.y, startX - aim.x);
        shot = { x: startX, y: startY, vx: Math.cos(angle) * power, vy: Math.sin(angle) * power, trail: [] };
        aim = null;
      };

      Engine.hooks.update = () => {
        if (config.moveTarget) {
          target.y += target.dir * 1.6;
          if (target.y < 90 || target.y > 250) target.dir *= -1;
        }
        if (!shot) return;
        shot.trail.push({ x: shot.x, y: shot.y });
        if (shot.trail.length > 22) shot.trail.shift();
        shot.x += shot.vx;
        shot.y += shot.vy;
        shot.vy += config.gravity === undefined ? 0.33 : config.gravity;
        if (dist(shot.x, shot.y, target.x, target.y) < 52) {
          score++;
          setBadge(stars(score, config.need));
          sfx('heart');
          shot = null;
          if (score >= config.need) { winGame(config.winText); return; }
          return;
        }
        if (shot.x > STAGE_W + 60 || shot.y > STAGE_H + 60 || shot.x < -60) shot = null;
      };

      Engine.hooks.draw = (c) => {
        paintSky(c, config.bg1, config.bg2);
        if (config.ground !== false) drawGround(c, 310, '#8ed46e');
        drawSlot(c, target.x, target.y, 50, !shot);
        drawEmoji(c, config.target, target.x, target.y, 62);

        if (shot) {
          shot.trail.forEach((p, i) => drawEmoji(c, config.trail || '✨', p.x, p.y, 14 + i, 0, i / 30));
          drawEmoji(c, config.projectile, shot.x, shot.y, 48, Engine.t * 0.35);
        } else {
          const px = aim ? startX - (aim.x - startX) * 0.35 : startX;
          const py = aim ? startY - (aim.y - startY) * 0.35 : startY;
          if (aim) {
            c.strokeStyle = '#ff4757';
            c.lineWidth = 5;
            c.setLineDash([8, 6]);
            c.beginPath(); c.moveTo(aim.x, aim.y); c.lineTo(px, py); c.stroke();
            c.setLineDash([]);
          }
          drawEmoji(c, config.projectile, px, py, 48, Engine.t * 0.05);
        }
        drawEmoji(c, config.player, startX - 40, startY + 45, 60);
      };

      startLoop();
    }

    /* ==================================================================
       機制七：手指帶著走、閃過障礙（直排輪、無人機）
       ================================================================== */
    function playDodge(club, config) {
      buildStage({ badge: stars(0, config.need), hint: config.hint });
      let me = { x: STAGE_W / 2, y: config.freeY ? 200 : 285 };
      let things = [], passed = 0, bump = 0, scroll = 0;

      showDemo([{ x: 320, y: 120 }, { x: 320, y: 270 }, { x: 320, y: 120 }], { speed: 0.010 });

      Engine.hooks.move = (x, y, down) => {
        if (!down) return;
        me.x = clamp(x, 40, STAGE_W - 40);
        me.y = clamp(y, 80, STAGE_H - 46);
      };

      Engine.hooks.update = () => {
        if (bump > 0) bump--;
        scroll += config.speed || 3.4;
        if (things.length === 0 || things[things.length - 1].x < STAGE_W - 200) {
          const lanes = [110, 190, 270];
          things.push({
            x: STAGE_W + 60,
            y: lanes[Math.floor(Math.random() * lanes.length)],
            hit: false, scored: false
          });
        }
        things.forEach(t => {
          t.x -= config.speed || 3.4;
          if (t.scored || t.hit) return;
          if (Math.abs(t.x - me.x) < 40) {
            const aligned = Math.abs(t.y - me.y) < 48;
            // 無人機要對準圈圈穿過去；直排輪要閃開三角錐
            const bad = config.through ? !aligned : aligned;
            if (bad) {
              t.hit = true; bump = 22; sfx('nope');
              passed = Math.max(0, passed - 1);
              setBadge(stars(passed, config.need));
              return;
            }
          }
          if (t.x < me.x - 42) {
            t.scored = true;
            passed++;
            sfx('heart');
            setBadge(stars(passed, config.need));
            if (passed >= config.need) winGame(config.winText);
          }
        });
        things = things.filter(t => t.x > -70);
      };

      Engine.hooks.draw = (c) => {
        paintSky(c, config.bg1, config.bg2);
        if (config.rink) {                 // 從上往下看的溜冰場，畫出往後跑的地板線
          c.strokeStyle = 'rgba(255,255,255,.75)';
          c.lineWidth = 5;
          c.setLineDash([30, 26]);
          c.lineDashOffset = -scroll;
          [150, 230, 310].forEach(y => { c.beginPath(); c.moveTo(0, y); c.lineTo(STAGE_W, y); c.stroke(); });
          c.setLineDash([]);
        }
        things.forEach(t => drawEmoji(c, t.hit ? '💥' : config.obstacle, t.x, t.y, config.obstacleSize || 60));
        drawEmoji(c, config.player, me.x + (bump > 0 ? Math.sin(Engine.t) * 8 : 0), me.y, 64);
      };

      startLoop();
    }

    /* ==================================================================
       機制八：移動球拍把球接住（桌球、排球）
       ================================================================== */
    function playRally(club, config) {
      buildStage({ badge: stars(0, config.need), hint: config.hint });
      let paddle = { x: STAGE_W / 2, y: config.paddleY || 300 };
      let ball = null, rally = 0, miss = 0;

      function serve() {
        ball = { x: 120 + Math.random() * 400, y: 40, vx: (Math.random() - 0.5) * 4, vy: config.ballSpeed || 3.4 };
      }
      serve();
      showDemo([{ x: 200, y: paddle.y }, { x: 440, y: paddle.y }], { speed: 0.012 });

      Engine.hooks.move = (x, y, down) => { if (down) paddle.x = clamp(x, 50, STAGE_W - 50); };

      Engine.hooks.update = () => {
        if (miss > 0) miss--;
        if (!ball) return;
        ball.x += ball.vx; ball.y += ball.vy;
        if (ball.x < 24 || ball.x > STAGE_W - 24) ball.vx *= -1;
        if (ball.y < 24) ball.vy = Math.abs(ball.vy);
        // 打到球拍就彈回去，彈的方向看打在球拍的哪一邊
        if (ball.vy > 0 && Math.abs(ball.y - paddle.y) < 26 && Math.abs(ball.x - paddle.x) < 62) {
          ball.vy = -Math.abs(ball.vy) - 0.15;
          ball.vx += (ball.x - paddle.x) * 0.09;
          rally++;
          sfx('heart');
          setBadge(stars(Math.min(rally, config.need), config.need));
          if (rally >= config.need) { winGame(config.winText); return; }
        }
        if (ball.y > STAGE_H + 40) { miss = 26; sfx('nope'); serve(); }
      };

      Engine.hooks.draw = (c) => {
        paintSky(c, config.bg1, config.bg2);
        if (config.net) {
          c.strokeStyle = '#22293f';
          c.lineWidth = 4;
          c.beginPath(); c.moveTo(0, 160); c.lineTo(STAGE_W, 160); c.stroke();
        }
        if (ball) drawEmoji(c, config.ball, ball.x, ball.y, 38, Engine.t * 0.25);
        drawEmoji(c, config.paddle, paddle.x + (miss > 0 ? Math.sin(Engine.t) * 6 : 0), paddle.y, 72);
      };

      startLoop();
    }

    /* ==================================================================
       機制九：用手指真的塗顏色（美術、奶油膠）
       ================================================================== */
    function playPaint(club, config) {
      const picker = '<div class="picker-row">'
        + config.colors.map((col, i) =>
            '<div class="picker-dot' + (i === 0 ? ' on' : '') + '" data-color="' + col.hex
            + '" style="background:' + col.hex + '">' + (col.emoji || '') + '</div>').join('')
        + '</div>';
      buildStage({ badge: stars(0, 4), hint: config.hint, picker: picker });

      let color = config.colors[0].hex;
      let strokes = [];
      const cells = {};                 // 用格子估算塗了多少
      let covered = 0;

      document.querySelectorAll('.picker-dot').forEach(dot => {
        dot.addEventListener('click', () => {
          document.querySelectorAll('.picker-dot').forEach(d => d.classList.remove('on'));
          dot.classList.add('on');
          color = dot.dataset.color;
          sfx('tap');
        });
      });

      showDemo([{ x: 250, y: 180 }, { x: 390, y: 210 }, { x: 250, y: 240 }], { speed: 0.010 });

      function mark(x, y) {
        if (x < config.area[0] || x > config.area[2] || y < config.area[1] || y > config.area[3]) return;
        const key = Math.floor(x / 26) + ',' + Math.floor(y / 26);
        if (cells[key]) return;
        cells[key] = 1;
        covered++;
        const goal = config.goal || 26;
        setBadge(stars(Math.min(4, Math.floor(covered / (goal / 4))), 4));
        if (covered >= goal) winGame(config.winText);
      }

      Engine.hooks.down = (x, y) => { strokes.push({ color: color, pts: [{ x: x, y: y }] }); mark(x, y); };
      Engine.hooks.move = (x, y, down) => {
        if (!down || !strokes.length) return;
        strokes[strokes.length - 1].pts.push({ x: x, y: y });
        mark(x, y);
      };

      Engine.hooks.draw = (c) => {
        paintSky(c, '#ffffff', '#fff6e8');
        strokes.forEach(s => {
          c.save();
          c.strokeStyle = s.color;
          c.lineWidth = config.brush || 30;
          c.lineCap = 'round';
          c.lineJoin = 'round';
          c.beginPath();
          s.pts.forEach((p, i) => i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y));
          c.stroke();
          c.restore();
        });
        if (config.outline) config.outline(c);   // 線稿畫在顏色上面，才不會被蓋掉
      };

      startLoop();
    }

    /* ==================================================================
       機制十：揮動畫圈施法（魔術、主播）
       ================================================================== */
    function playWand(club, config) {
      buildStage({ badge: stars(0, config.need), hint: config.hint });
      const cx = 330, cy = 190, ring = 96;
      let checks = [0, 0, 0, 0], sparks = [], done = 0, reveal = 0;

      const points = [0, 1, 2, 3].map(i => ({
        x: cx + Math.cos(i * Math.PI / 2 - Math.PI / 2) * ring,
        y: cy + Math.sin(i * Math.PI / 2 - Math.PI / 2) * ring
      }));
      showDemo(points.concat([points[0]]), { speed: 0.009 });

      Engine.hooks.move = (x, y, down) => {
        if (!down || Engine.finished) return;
        sparks.push({ x: x, y: y, life: 1 });
        points.forEach((p, i) => {
          if (!checks[i] && dist(x, y, p.x, p.y) < 52) {
            checks[i] = 1;
            sfx('tap');
            if (checks.every(Boolean)) {
              done++;
              reveal = 1;
              setBadge(stars(done, config.need));
              sfx('heart');
              if (done >= config.need) winGame(config.winText);
              else { checks = [0, 0, 0, 0]; setFeedback(config.again || ''); }
            }
          }
        });
      };

      Engine.hooks.update = () => {
        sparks.forEach(s => s.life -= 0.035);
        sparks = sparks.filter(s => s.life > 0);
        if (reveal > 0 && reveal < 60) reveal++;
      };

      Engine.hooks.draw = (c) => {
        paintSky(c, config.bg1 || '#2f2350', config.bg2 || '#6c4bb0');
        drawEmoji(c, config.prop, cx, cy + 30, 110);
        points.forEach((p, i) => {
          drawSlot(c, p.x, p.y, 30, !checks[i]);
          drawEmoji(c, checks[i] ? '✅' : '⭐', p.x, p.y, 34, 0, checks[i] ? 1 : 0.75);
        });
        sparks.forEach(s => drawEmoji(c, '✨', s.x, s.y, 14 + s.life * 26, 0, s.life));
        if (reveal > 0) drawEmoji(c, config.magic, cx, cy - 40 - reveal * 0.8, 60 + reveal * 0.5, 0, clamp(reveal / 20, 0, 1));
        drawEmoji(c, '🪄', Engine.pointer.x, Engine.pointer.y, 44, -0.6);
      };

      startLoop();
    }

    /* ==================================================================
       機制十一：棋盤點格子（圍棋／五子棋）
       ================================================================== */
    function playGomoku(club, config) {
      const N = 7, pad = 60, gap = (STAGE_H - pad * 2) / (N - 1);
      const ox = STAGE_W / 2 - gap * (N - 1) / 2;
      buildStage({ badge: stars(0, 4), hint: config.hint });
      const board = Array.from({ length: N }, () => new Array(N).fill(0));
      let last = null;

      const px = i => ox + i * gap;
      const py = j => pad + j * gap;
      showDemo([{ x: px(3), y: py(3) }], { tapping: true, speed: 0.02 });

      function longest(who) {
        let best = 0;
        const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
        for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
          if (board[i][j] !== who) continue;
          dirs.forEach(([dx, dy]) => {
            let n = 0, x = i, y = j;
            while (x >= 0 && x < N && y >= 0 && y < N && board[x][y] === who) { n++; x += dx; y += dy; }
            if (n > best) best = n;
          });
        }
        return best;
      }

      Engine.hooks.down = (mx, my) => {
        if (Engine.finished) return;
        let bi = -1, bj = -1, best = 1e9;
        for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
          const d = dist(mx, my, px(i), py(j));
          if (d < best) { best = d; bi = i; bj = j; }
        }
        if (best > gap * 0.6 || board[bi][bj]) { sfx('nope'); return; }
        board[bi][bj] = 1;
        last = { i: bi, j: bj };
        sfx('tap');
        const run = longest(1);
        setBadge(stars(clamp(run - 1, 0, 4), 4));
        if (run >= 5) { winGame(config.winText); return; }
        // 電腦隨便找個空位陪你下（一年級只要體驗黑白輪流和連線）
        const empty = [];
        for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) if (!board[i][j]) empty.push([i, j]);
        if (empty.length) {
          const pick = empty[Math.floor(Math.random() * empty.length)];
          board[pick[0]][pick[1]] = 2;
        }
      };

      Engine.hooks.draw = (c) => {
        paintSky(c, '#f7dfae', '#e8c98a');
        c.strokeStyle = '#7a5a2e';
        c.lineWidth = 2;
        for (let i = 0; i < N; i++) {
          c.beginPath(); c.moveTo(px(i), py(0)); c.lineTo(px(i), py(N - 1)); c.stroke();
          c.beginPath(); c.moveTo(px(0), py(i)); c.lineTo(px(N - 1), py(i)); c.stroke();
        }
        for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
          if (!board[i][j]) continue;
          const isNew = last && last.i === i && last.j === j;
          c.save();
          c.fillStyle = board[i][j] === 1 ? '#22293f' : '#ffffff';
          c.strokeStyle = '#22293f';
          c.lineWidth = 2.5;
          c.beginPath(); c.arc(px(i), py(j), gap * 0.42, 0, Math.PI * 2);
          c.fill(); c.stroke();
          if (isNew) { c.strokeStyle = '#ff4757'; c.lineWidth = 4; c.stroke(); }
          c.restore();
        }
      };

      startLoop();
    }

    /* ==================================================================
       機制十二：把黏土拉出形狀（黏土社）
       ================================================================== */
    function playClay(club, config) {
      buildStage({ badge: stars(0, config.parts.length), hint: config.hint });
      const cx = STAGE_W / 2, cy = 200, R = 78;
      let made = [], held = null;

      const nextPart = () => config.parts[made.length];
      function demoNext() {
        const part = nextPart();
        if (!part) return;
        showDemo([{ x: cx + part.fx * R, y: cy + part.fy * R },
                  { x: cx + part.fx * (R + 62), y: cy + part.fy * (R + 62) }], { speed: 0.012 });
      }
      demoNext();

      Engine.hooks.down = (x, y) => {
        const part = nextPart();
        if (!part) return;
        const gx = cx + part.fx * R, gy = cy + part.fy * R;
        if (dist(x, y, gx, gy) < 62) { held = { x: x, y: y }; sfx('tap'); }
      };
      Engine.hooks.move = (x, y, down) => { if (held && down) { held.x = x; held.y = y; } };
      Engine.hooks.up = () => {
        if (!held) return;
        const part = nextPart();
        const pulled = dist(held.x, held.y, cx + part.fx * R, cy + part.fy * R);
        if (pulled > 42) {                       // 真的把黏土拉出來了
          made.push(part);
          sfx('heart');
          setBadge(stars(made.length, config.parts.length));
          if (made.length >= config.parts.length) winGame(config.winText);
          else { setFeedback(config.steps && config.steps[made.length - 1] || ''); demoNext(); }
        } else { sfx('nope'); }
        held = null;
      };

      Engine.hooks.draw = (c) => {
        paintSky(c, '#fff6ea', '#ffe4c9');
        drawGround(c, 300, '#d9b892');
        // 黏土本體：被拉的地方會跟著手指鼓出來
        c.save();
        c.fillStyle = config.color;
        c.strokeStyle = '#22293f';
        c.lineWidth = 4;
        c.beginPath();
        for (let a = 0; a <= Math.PI * 2 + 0.01; a += 0.12) {
          let r = R;
          if (held) {
            const ha = Math.atan2(held.y - cy, held.x - cx);
            let diff = Math.abs(((a - ha + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
            if (diff < 0.7) r += (dist(held.x, held.y, cx, cy) - R) * (1 - diff / 0.7) * 0.8;
          }
          const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
          a === 0 ? c.moveTo(x, y) : c.lineTo(x, y);
        }
        c.closePath(); c.fill(); c.stroke();
        c.restore();

        made.forEach(p => drawEmoji(c, p.emoji, cx + p.fx * (R + 26), cy + p.fy * (R + 26), p.size || 44));
        const part = nextPart();
        if (part && !held) drawSlot(c, cx + part.fx * R, cy + part.fy * R, 34, true);
        if (made.length >= config.parts.length) drawEmoji(c, config.face, cx, cy, 56);
      };

      startLoop();
    }

    /* ==================================================================
       機制十三：把燒杯拿去倒（科學實驗）
       ================================================================== */
    function playPour(club, config) {
      buildStage({ badge: stars(0, config.bottles.length), hint: config.hint });
      const flask = { x: 430, y: 250 };
      const bottles = config.bottles.map((b, i) => Object.assign({}, b, {
        idx: i, x: 90 + i * 105, y: 250, homeX: 90 + i * 105, homeY: 250, used: false
      }));
      let held = null, poured = 0, mixColor = '#dfe6f0', bubbles = [], erupt = 0;

      showDemo([{ x: bottles[0].x, y: bottles[0].y }, { x: flask.x, y: flask.y - 60 }], { speed: 0.011 });

      Engine.hooks.down = (x, y) => {
        held = bottles.find(b => !b.used && dist(x, y, b.x, b.y) < 52) || null;
        if (held) sfx('tap');
      };
      Engine.hooks.move = (x, y, down) => { if (held && down) { held.x = x; held.y = y; } };
      Engine.hooks.up = () => {
        if (!held) return;
        if (dist(held.x, held.y, flask.x, flask.y - 50) < 92) {
          held.used = true;
          poured++;
          mixColor = held.color;
          sfx('heart');
          setBadge(stars(poured, config.bottles.length));
          for (let i = 0; i < 14; i++) {
            bubbles.push({ x: flask.x + (Math.random() - 0.5) * 40, y: flask.y, v: 1 + Math.random() * 2, life: 1 });
          }
          if (poured >= config.bottles.length) { erupt = 1; winGame(config.winText); }
          else setFeedback(config.steps && config.steps[poured - 1] || '');
        } else { sfx('nope'); }
        if (held && !held.used) { held.x = held.homeX; held.y = held.homeY; }
        held = null;
      };

      Engine.hooks.update = () => {
        bubbles.forEach(b => { b.y -= b.v; b.life -= 0.014; });
        bubbles = bubbles.filter(b => b.life > 0);
        if (erupt > 0 && erupt < 70) {
          erupt++;
          if (erupt % 3 === 0) bubbles.push({ x: flask.x + (Math.random() - 0.5) * 60, y: flask.y - 40, v: 2.5, life: 1 });
        }
      };

      Engine.hooks.draw = (c) => {
        paintSky(c, '#eef6ff', '#d4e7fb');
        c.fillStyle = '#b98a5c';
        c.fillRect(0, 300, STAGE_W, 60);
        drawSlot(c, flask.x, flask.y - 50, 60, !!held);
        // 燒瓶裡的液體
        c.save();
        c.fillStyle = mixColor;
        c.beginPath(); c.arc(flask.x, flask.y + 8, 34, 0, Math.PI * 2); c.fill();

      }),

      // E3 瘋狂積木：疊出太空基地
      E3: club => playDragPuzzle(club, {
        ordered: true, bg1: '#232048', bg2: '#4a3f7d', hint: '一塊一塊往上疊！',
        board: c => { c.fillStyle = '#6b5f9e'; c.fillRect(0, 320, STAGE_W, 40); },
        slots: [
          { x: 430, y: 292, ghost: '🟦' }, { x: 430, y: 244, ghost: '🟦' },
          { x: 430, y: 196, ghost: '🟨' }, { x: 430, y: 148, ghost: '📡' },
          { x: 430, y: 100, ghost: '🚀' }
        ],
        items: [
          { emoji: '🟦', x: 95, y: 130, slot: 0 }, { emoji: '🟦', x: 175, y: 130, slot: 1 },
          { emoji: '🟨', x: 95, y: 220, slot: 2 }, { emoji: '📡', x: 175, y: 220, slot: 3 },
          { emoji: '🚀', x: 135, y: 305, slot: 4 }
        ],
        winText: '太空基地完工！可以升空了！'
      }),

      // E5 頂尖桌遊社：把骰子甩出去丟中寶箱
      E5: club => playSling(club, {
        need: 3, gravity: 0.3, moveTarget: true, hint: '往後拉再放開！',
        bg1: '#fff2e0', bg2: '#ffdcc0',
        projectile: '🎲', target: '🎁', trail: '⭐', player: '🧒',
        winText: '三次都中！運氣超好！'
      }),

      // E6 韓國熱舞社（週五）
      E6: club => playRhythm(club, {
        need: 6, fall: 3.5, gap: 56, hint: '音符到圈圈就點！',
        lanes: ['🎵', '🎶', '🎼'], note: '💗', dancer: '🕺',
        winText: '韓流舞力全開！超帥氣！'
      }),

      // H1 黏土手作：把黏土往外拉，捏出耳朵和尾巴
      H1: club => playClay(club, {
        hint: '把黏土往外拉！', color: '#ffd83d', face: '😊',
        parts: [
          { emoji: '👂', fx: -0.62, fy: -0.72 },
          { emoji: '👂', fx: 0.62, fy: -0.72 },
          { emoji: '⚡', fx: 0.92, fy: 0.42 }
        ],
        steps: ['再拉一隻耳朵！', '最後拉出尾巴！'],
        winText: '皮卡丘捏好了！好可愛！'
      }),

      // H2 流行舞蹈（基礎）：節奏慢一點
      H2: club => playRhythm(club, {
        need: 4, fall: 2.4, gap: 84, hint: '音符到圈圈就點！',
        lanes: ['👣', '👏', '🔄'], note: '🌟', dancer: '🩰',
        winText: '動作好標準！跳得真好！'
      }),

      // H3 初階排球：移動雙手把球墊起來
      H3: club => playRally(club, {
        need: 5, hint: '移動雙手接球！', bg1: '#fff8e0', bg2: '#ffe6b8',
        paddle: '🤲', ball: '🏐', ballSpeed: 3.0, paddleY: 295, net: true,
        winText: '球都沒有掉！團隊合作成功！'
      })
    };

    function launchGame(index) {
      const club = clubs[index];
      modalClubName.textContent = '🎮 ' + club.name;
      modalClubRule.textContent = RULES[club.code] || '';
      modal.classList.add('active');

      const build = GAMES[club.code];
      if (build) build(club);
      afterLaunch(club);
    }

    // 關閉 Modal
    function closeGame() {
      modal.classList.remove('active');
      stopSpeaking();
      stopLoop();                       // 停掉畫面動畫，不要在背景空轉
    }

    document.querySelector('#modalCloseBtn').addEventListener('click', closeGame);

    modal.addEventListener('click', event => {
      if (event.target === modal) closeGame();
    });
  </script>
</body>
</html>
